<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>عالم الأواني | N.N.G Group</title>
<meta name="description" content="عالم الأواني من N.N.G Group — أفخم ماركات أدوات المطبخ والمنزل في سورية.">
<meta name="theme-color" content="#b0144f">
<link rel="preconnect" href="https://images.pexels.com"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--b:#d4176a;--b2:#8e1940;--b3:#fde7f0;--ink:#1d1b1e;--mu:#77707a;--ln:#f0e8ec;--bg:#f7f3f5;--card:#fff;--ok:#1f9d55;--sat:env(safe-area-inset-top);--sab:env(safe-area-inset-bottom)}
.dark{--ink:#f3eef1;--mu:#a9a0a6;--ln:#2c2529;--bg:#141013;--card:#1e181c;--b3:#3a1626}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:Tajawal,system-ui,sans-serif;background:#e9e1e5;color:var(--ink);overscroll-behavior-y:none}
.dark body,body.dark{background:#0b080a}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink)}
img{display:block}
#app{max-width:480px;margin:0 auto;min-height:100%;background:var(--bg);position:relative;box-shadow:0 0 40px rgba(0,0,0,.08);overflow-x:hidden}
.view{padding-bottom:calc(84px + var(--sab));min-height:100vh;animation:fi .22s ease}
@keyframes fi{from{opacity:.0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* top bars */
.top{position:sticky;top:0;z-index:20;background:var(--card);padding:calc(10px + var(--sat)) 14px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--ln)}
.top h1{font-size:17px;font-weight:800;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--bg);flex:none;position:relative}
.ib svg{width:22px;height:22px}
.logo{display:flex;align-items:center;gap:8px;flex:1}
.logo svg{width:40px;height:40px}
.logo b{font-size:18px;font-weight:900;color:var(--b2);line-height:1}
.dark .logo b{color:#ff7fb1}
.logo small{display:block;font-size:10.5px;color:var(--mu);font-weight:500;margin-top:3px;letter-spacing:.3px}
.sbar{margin:12px 14px 4px;height:46px;border-radius:14px;background:var(--card);border:1px solid var(--ln);display:flex;align-items:center;gap:8px;padding:0 14px;color:var(--mu);font-size:14.5px}
.sbar svg{width:20px;height:20px}
/* bottom nav */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:30;background:var(--card);border-top:1px solid var(--ln);display:flex;padding:6px 6px calc(6px + var(--sab))}
.nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:700;color:var(--mu);text-decoration:none;padding:4px 0;position:relative}
.nav a svg{width:24px;height:24px}
.nav a.on{color:var(--b)}
.bd{position:absolute;top:0;left:calc(50% - 22px);min-width:18px;height:18px;border-radius:9px;background:var(--b);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 4px;font-weight:800}
.bd:empty{display:none}
/* banners */
.ban{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:10px;padding:12px 14px 4px;scrollbar-width:none}
.ban::-webkit-scrollbar,.row::-webkit-scrollbar,.chips::-webkit-scrollbar{display:none}
.bn{flex:0 0 100%;scroll-snap-align:center;height:168px;border-radius:20px;position:relative;overflow:hidden;color:#fff;padding:20px 18px;display:flex;flex-direction:column;justify-content:center}
.bn h3{font-size:22px;font-weight:900;line-height:1.25;max-width:62%}
.bn p{font-size:13px;opacity:.92;margin:6px 0 12px;max-width:62%}
.bn .go{align-self:flex-start;background:#fff;color:var(--b2);font-weight:800;font-size:13px;padding:8px 14px;border-radius:10px}
.bn img{position:absolute;left:10px;bottom:10px;width:120px;height:120px;border-radius:18px;object-fit:cover;box-shadow:0 10px 24px rgba(0,0,0,.25)}
.dots{display:flex;justify-content:center;gap:5px;margin:6px 0 2px}
.dots i{width:6px;height:6px;border-radius:3px;background:#d9c9d1;transition:.25s}
.dots i.on{width:18px;background:var(--b)}
/* sections */
.sec{display:flex;align-items:center;justify-content:space-between;margin:20px 14px 10px}
.sec h2{font-size:18px;font-weight:900}
.sec a{font-size:13px;font-weight:800;color:var(--b);text-decoration:none}
.cats{display:flex;gap:12px;overflow-x:auto;padding:0 14px;scrollbar-width:none}
.cat{flex:0 0 74px;text-align:center;text-decoration:none;color:var(--ink);font-size:11.5px;font-weight:700;line-height:1.3}
.cat .ci{width:68px;height:68px;margin:0 auto 6px;border-radius:50%;background:#fff;overflow:hidden;border:2px solid var(--b3);display:grid;place-items:center}
.cat .ci img{width:100%;height:100%;object-fit:cover}
.row{display:flex;gap:10px;overflow-x:auto;padding:0 14px 4px;scroll-snap-type:x proximity;scrollbar-width:none}
.row .pc{flex:0 0 150px;scroll-snap-align:start}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 14px}
/* product card */
.pc{background:var(--card);border-radius:16px;overflow:hidden;position:relative;display:flex;flex-direction:column;text-decoration:none;color:var(--ink);border:1px solid var(--ln)}
.pc .im{aspect-ratio:1;background:#fff;position:relative}
.pc .im img{width:100%;height:100%;object-fit:contain}
.sk{background:linear-gradient(90deg,#f4eef1 25%,#fbf8f9 50%,#f4eef1 75%);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
.tag{position:absolute;top:8px;right:8px;font-size:11px;font-weight:800;color:#fff;background:var(--b);padding:3px 7px;border-radius:7px}
.tag.n{background:var(--ok)}.tag.h{background:#222}
.fv{position:absolute;top:6px;left:6px;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;color:#555}
.fv svg{width:17px;height:17px}.fv.on{color:var(--b)}.fv.on path{fill:currentColor}
.pc .bx{padding:8px 10px 10px;display:flex;flex-direction:column;gap:4px;flex:1}
.pc .nm{font-size:13.5px;font-weight:700;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:36px}
.pr{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.pr b{font-size:16px;font-weight:900;color:var(--b2)}
.dark .pr b{color:#ff7fb1}
.pr s{font-size:12px;color:var(--mu)}
.pr em{font-style:normal;font-size:11px;font-weight:800;color:var(--ok)}
.qa{position:absolute;bottom:10px;left:10px;width:32px;height:32px;border-radius:10px;background:var(--b);color:#fff;display:grid;place-items:center;font-size:20px;font-weight:700;line-height:1}
.qa.in{background:var(--ok);font-size:15px}
/* offers strip */
.deal{margin:16px 14px 0;border-radius:18px;background:linear-gradient(110deg,var(--b2),var(--b));color:#fff;padding:14px;display:flex;align-items:center;justify-content:space-between}
.deal b{font-size:17px;font-weight:900}
.cd{display:flex;gap:4px;direction:ltr}
.cd span{background:rgba(255,255,255,.2);border-radius:8px;padding:5px 7px;font-weight:800;font-size:14px;min-width:34px;text-align:center}
.trust{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 14px 0}
.trust div{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:12px 6px;text-align:center;font-size:11.5px;font-weight:700}
.trust i{display:block;font-style:normal;font-size:22px;margin-bottom:4px}
.ig{margin:18px 14px 0;border-radius:18px;padding:16px;background:var(--card);border:1px solid var(--ln);display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink)}
.ig .gi{width:46px;height:46px;border-radius:14px;background:radial-gradient(circle at 30% 110%,#fdf497 0,#fd5949 45%,#d6249f 60%,#285AEB 90%);display:grid;place-items:center;color:#fff;flex:none}
.ig b{display:block;font-weight:800}.ig small{color:var(--mu);font-size:12.5px}
/* chips / filters */
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 14px;scrollbar-width:none;position:sticky;top:calc(61px + var(--sat));z-index:10;background:var(--bg)}
.chip{white-space:nowrap;padding:8px 14px;border-radius:999px;background:var(--card);border:1px solid var(--ln);font-size:13px;font-weight:700}
.chip.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.cnt{padding:0 14px 8px;font-size:12.5px;color:var(--mu)}
.more{display:block;margin:16px auto;padding:11px 26px;border-radius:12px;border:1.5px solid var(--b);color:var(--b);font-weight:800}
.empty{text-align:center;padding:60px 24px;color:var(--mu)}
.empty .ei{font-size:56px;margin-bottom:10px}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:6px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:50px;border-radius:14px;background:var(--b);color:#fff;font-weight:800;font-size:16px;width:100%;text-decoration:none}
.btn.o{background:var(--b3);color:var(--b2)}
.btn.g{background:#1faa59}
.btn:active,.qa:active,.chip:active{transform:scale(.97)}
/* category list page */
.clist{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px}
.cl{background:var(--card);border:1px solid var(--ln);border-radius:18px;overflow:hidden;text-decoration:none;color:var(--ink)}
.cl .cim{display:grid;grid-template-columns:1fr 1fr;aspect-ratio:1.4;background:#fff}
.cl .cim img{width:100%;height:100%;object-fit:contain}
.cl div.t{padding:10px 12px;font-weight:800;font-size:14px;display:flex;justify-content:space-between}
.cl div.t span{color:var(--mu);font-weight:600;font-size:12px}
/* product page */
.pp .gal{background:#fff;position:relative;aspect-ratio:1}
.pp .gal img{width:100%;height:100%;object-fit:contain}
.pp .bk{position:absolute;top:calc(12px + var(--sat));right:12px;z-index:3}
.pp .tl{position:absolute;top:calc(12px + var(--sat));left:12px;display:flex;gap:8px;z-index:3}
.pp .ib.w{background:rgba(255,255,255,.95);box-shadow:0 2px 10px rgba(0,0,0,.1);color:#222}
.pinfo{background:var(--card);border-radius:24px 24px 0 0;margin-top:-20px;position:relative;padding:20px 16px 8px}
.pinfo .cc{font-size:12.5px;color:var(--b);font-weight:800;text-decoration:none}
.pinfo h2{font-size:21px;font-weight:900;line-height:1.35;margin:6px 0 10px}
.pinfo .pr b{font-size:26px}
.pinfo .pr s{font-size:15px}
.pinfo .pr em{font-size:12.5px;background:#e3f6ea;padding:3px 8px;border-radius:7px}
.desc{color:var(--mu);line-height:1.8;font-size:14.5px;margin:12px 0}
.feat{display:grid;gap:8px;margin:14px 0}
.feat div{display:flex;align-items:center;gap:10px;font-size:13.5px;font-weight:600;background:var(--bg);border-radius:12px;padding:10px 12px}
.feat i{font-style:normal;font-size:18px}
.qrow{display:flex;align-items:center;justify-content:space-between;margin:14px 0;font-weight:800}
.st{display:flex;align-items:center;border:1.5px solid var(--ln);border-radius:12px;background:var(--card)}
.st button{width:40px;height:40px;font-size:20px;font-weight:800;color:var(--b2)}
.st span{min-width:30px;text-align:center;font-weight:900;font-size:16px}
.sticky{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:35;background:var(--card);border-top:1px solid var(--ln);padding:10px 14px calc(10px + var(--sab));display:flex;gap:10px;align-items:center}
.sticky .tp{flex:none;min-width:90px}
.sticky .tp small{display:block;font-size:11.5px;color:var(--mu)}
.sticky .tp b{font-size:19px;font-weight:900;color:var(--b2)}
/* cart */
.ci2{display:flex;gap:12px;background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:10px;margin:10px 14px 0}
.ci2 .t{width:84px;height:84px;border-radius:12px;background:#fff;flex:none;overflow:hidden}
.ci2 .t img{width:100%;height:100%;object-fit:contain}
.ci2 .m{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.ci2 .n{font-weight:700;font-size:14px;line-height:1.35}
.ci2 .r{display:flex;align-items:center;justify-content:space-between;margin-top:auto}
.ci2 .st button{width:32px;height:32px;font-size:17px}
.rm{color:var(--mu);font-size:12px;font-weight:700;text-decoration:underline}
.box{background:var(--card);border:1px solid var(--ln);border-radius:18px;padding:14px;margin:12px 14px 0}
.box h3{font-size:15.5px;font-weight:900;margin-bottom:10px}
.ln{display:flex;justify-content:space-between;font-size:14px;padding:5px 0;color:var(--mu)}
.ln b{color:var(--ink)}
.ln.tot{border-top:1px dashed var(--ln);margin-top:6px;padding-top:10px;font-size:17px;color:var(--ink);font-weight:900}
.prog{height:8px;border-radius:4px;background:var(--bg);overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--b),#ff6ea8);border-radius:4px;transition:.4s}
.cp{display:flex;gap:8px}
.cp input{flex:1;min-width:0;height:44px;border:1.5px solid var(--ln);border-radius:12px;padding:0 12px;background:var(--bg);text-transform:uppercase}
.cp button{flex:none;padding:0 16px;border-radius:12px;background:var(--ink);color:var(--card);font-weight:800}
.ok{color:var(--ok);font-size:12.5px;font-weight:700;margin-top:6px}.er{color:#d33;font-size:12.5px;font-weight:700;margin-top:6px}
/* forms */
.f{display:grid;gap:12px}
.f label{display:grid;gap:5px;font-size:13px;font-weight:800}
.f input,.f select,.f textarea{height:48px;border:1.5px solid var(--ln);border-radius:12px;padding:0 12px;background:var(--bg);outline:none;width:100%}
.f textarea{height:76px;padding:10px 12px;resize:none}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--b)}
.f .bad{border-color:#d33}
.pay{display:grid;gap:8px}
.pay label{display:flex;align-items:center;gap:10px;border:1.5px solid var(--ln);border-radius:12px;padding:12px;font-size:14px;font-weight:700;background:var(--bg)}
.pay label:has(input:checked){border-color:var(--b);background:var(--b3)}
.pay input{width:18px;height:18px;accent-color:var(--b)}
.steps{display:flex;gap:6px;padding:12px 14px 0}
.steps i{flex:1;height:5px;border-radius:3px;background:var(--ln)}.steps i.on{background:var(--b)}
/* success */
.succ{text-align:center;padding:40px 22px}
.succ .ck{width:96px;height:96px;border-radius:50%;background:#e3f6ea;color:var(--ok);display:grid;place-items:center;margin:0 auto 16px;font-size:48px;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.3)}to{transform:scale(1)}}
.succ h2{font-size:22px;font-weight:900}
.succ .on{display:inline-block;margin:12px 0;background:var(--card);border:1px dashed var(--b);border-radius:12px;padding:8px 16px;font-weight:900;letter-spacing:1px;direction:ltr}
/* account */
.prof{margin:14px;border-radius:20px;padding:18px;background:linear-gradient(120deg,var(--b2),var(--b));color:#fff;display:flex;gap:12px;align-items:center}
.prof .av{width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;font-size:24px;font-weight:900}
.menu{margin:0 14px;background:var(--card);border:1px solid var(--ln);border-radius:18px;overflow:hidden}
.menu a,.menu button{display:flex;align-items:center;gap:12px;padding:15px 14px;border-bottom:1px solid var(--ln);width:100%;text-align:right;text-decoration:none;color:var(--ink);font-weight:700;font-size:14.5px}
.menu a:last-child,.menu button:last-child{border:0}
.menu i{font-style:normal;width:34px;height:34px;border-radius:10px;background:var(--b3);display:grid;place-items:center;flex:none}
.menu span.ar{margin-inline-start:auto;color:var(--mu)}
.ord{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:12px 14px;margin:10px 14px 0}
.ord .h{display:flex;justify-content:space-between;font-weight:800}
.ord .s{font-size:12px;font-weight:800;color:#b7791f;background:#fdf3dd;padding:3px 8px;border-radius:7px}
.ord .th{display:flex;gap:6px;margin-top:10px}
.ord .th img{width:44px;height:44px;border-radius:10px;background:#fff;object-fit:contain;border:1px solid var(--ln)}
.page{padding:16px;line-height:1.9;font-size:14.5px}
.page h3{font-size:16px;font-weight:900;margin:16px 0 6px}
details{background:var(--card);border:1px solid var(--ln);border-radius:14px;margin:8px 0;padding:12px 14px}
summary{font-weight:800;cursor:pointer}
/* search */
.sin{flex:1;height:42px;border-radius:12px;border:1.5px solid var(--ln);background:var(--bg);padding:0 12px;outline:none}
.sin:focus{border-color:var(--b)}
.hist{display:flex;flex-wrap:wrap;gap:8px;padding:6px 14px}
/* sheet */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;opacity:0;pointer-events:none;transition:.25s}
.ov.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,105%);width:100%;max-width:480px;z-index:51;background:var(--card);border-radius:24px 24px 0 0;padding:10px 16px calc(16px + var(--sab));transition:.3s cubic-bezier(.2,.8,.2,1);max-height:85vh;overflow:auto}
.sheet.on{transform:translate(-50%,0)}
.grab{width:42px;height:5px;border-radius:3px;background:var(--ln);margin:0 auto 12px}
.zoom{position:fixed;inset:0;z-index:60;background:#fff;display:none;align-items:center;justify-content:center}
.zoom.on{display:flex}
.zoom img{max-width:100%;max-height:100%;object-fit:contain}
.toast{position:fixed;left:50%;bottom:calc(92px + var(--sab));transform:translate(-50%,30px);opacity:0;background:#1d1b1e;color:#fff;padding:11px 18px;border-radius:14px;z-index:70;font-weight:700;font-size:14px;transition:.3s;pointer-events:none;white-space:nowrap}
.toast.on{transform:translate(-50%,0);opacity:1}
.splash{position:fixed;inset:0;z-index:100;background:linear-gradient(140deg,var(--b2),var(--b));display:grid;place-items:center;transition:opacity .4s}
.splash.off{opacity:0;pointer-events:none}
.splash div{text-align:center;color:#fff;animation:pop .6s cubic-bezier(.2,1.5,.4,1)}
.splash svg{width:96px;height:96px;margin:0 auto 10px;display:block}
.splash b{font-size:26px;font-weight:900;display:block}
.note{margin:14px;font-size:11.5px;color:var(--mu);text-align:center}

/* ===== هوية جديدة ===== */
body{background:#efe7eb}
#app{background:#fff}
.view,#v{background:#fff}
.hdr{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding:calc(8px + var(--sat)) 12px 8px;border-bottom:1px solid #f3eaee}
.hdr .lg{display:flex;flex-direction:column;align-items:center;text-decoration:none}
.hdr .lg b{font-size:21px;font-weight:900;color:var(--b2);letter-spacing:-.3px;line-height:1.1}
.hdr .lg small{font-size:9.5px;letter-spacing:2.4px;color:var(--b);font-weight:700;text-transform:uppercase}
.hdr .ib{background:#fff;border:1px solid #f1e6eb}
.hero{position:relative;margin:14px 14px 0;border-radius:22px;overflow:hidden;height:212px;box-shadow:0 14px 30px -12px rgba(142,25,64,.45)}
.hero .tr{display:flex;height:100%;transition:transform .55s cubic-bezier(.25,.8,.25,1)}
.sl{flex:0 0 100%;height:100%;position:relative;overflow:hidden;color:#fff;display:flex;align-items:center;padding:0 20px;text-decoration:none}
.sl:before{content:"";position:absolute;width:260px;height:260px;border-radius:50%;left:-60px;top:-30px;background:rgba(255,255,255,.08)}
.sl:after{content:"";position:absolute;width:140px;height:140px;border-radius:50%;left:110px;bottom:-70px;background:rgba(255,255,255,.07)}
.sl .tx{position:relative;z-index:2;max-width:56%}
.sl .k{display:inline-block;font-size:11px;font-weight:800;background:rgba(255,255,255,.18);padding:4px 10px;border-radius:20px;margin-bottom:8px}
.sl h3{font-size:22px;font-weight:900;line-height:1.25}
.sl p{font-size:12.5px;opacity:.9;margin:6px 0 12px;line-height:1.5}

 <div class="box">${left>0?`<div style="font-size:13.5px;font-weight:700">ضيف بـ <b style="color:var(--b)">${fmt(left)}</b> كمان وخود التوصيل مجاني 🚚</div>`:'<div style="font-size:13.5px;font-weight:800;color:var(--ok)">مبروك! التوصيل عليك مجاني 🎉</div>'}<div class="prog"><i style="width:${Math.min(100,(t.sub-t.dsc)/FREE_SHIP*100)}%"></i></div></div>
 <div class="box"><h3>كود خصم</h3><div class="cp"><input id="cpn" placeholder="دخّل الكود" value="${coupon}" autocomplete="off"><button onclick="applyCp()">تطبيق</button></div><div id="cpm">${coupon&&t.pc?`<div class="ok">✓ خصم ${t.pc}% انطبق</div>`:''}</div></div>
 <div class="box"><h3>ملخص الطلب</h3><div class="ln">المجموع<b>${fmt(t.sub)}</b></div>${t.dsc?`<div class="ln">الخصم<b style="color:var(--ok)">-${fmt(t.dsc)}</b></div>`:''}<div class="ln">التوصيل${t.ship?' (يبدأ من)':''}<b>${t.ship?fmt(t.ship):'مجاني'}</b></div><div class="ln tot">الإجمالي<span>${fmt(t.tot)}</span></div></div>
 <div style="padding:14px"><a class="btn" href="#checkout">متابعة للطلب ←</a></div>`}
function qty(id,d){cart[id]=(cart[id]||0)+d;if(cart[id]<=0){delete cart[id];toast('انحذف من السلة')}save();cartView()}
function applyCp(){const c=$('cpn').value.trim().toUpperCase();if(COUPONS[c]){coupon=c;S.set('coupon',c);toast('انطبق الخصم ✓');cartView()}else{coupon='';S.set('coupon','');$('cpm').innerHTML='<div class="er">الكود مو صحيح</div>'}}

/* ===== إتمام الطلب ===== */
function checkout(){if(!cartCount()){location.hash='#cart';return}
 const t=totals(info.g);
 $('v').innerHTML=topBar('إتمام الطلب')+`<div class="steps"><i class="on"></i><i class="on"></i><i></i></div>
 <div class="box"><h3>معلومات التوصيل</h3><form class="f" id="cf" onsubmit="placeOrder(event)" novalidate>
 <label>الاسم الكامل<input name="n" value="${esc(info.n||'')}" autocomplete="name" required></label>
 <label>رقم الموبايل<input name="ph" value="${esc(info.ph||'')}" inputmode="tel" placeholder="09xxxxxxxx" autocomplete="tel" required></label>
 <label>المحافظة<select name="g" required onchange="info.g=this.value;sumBox()"><option value="">اختار المحافظة</option>${GOV.map(g=>`<option${info.g===g?' selected':''}>${g}</option>`).join('')}</select></label>
 <label>المنطقة / الحي<input name="ar" value="${esc(info.ar||'')}" required></label>
 <label>العنوان بالتفصيل<textarea name="a" placeholder="الشارع، البناء، الطابق، أقرب معلم">${esc(info.a||'')}</textarea></label>
 <label>ملاحظات (اختياري)<input name="no" placeholder="وقت التوصيل المناسب مثلاً"></label>
 <div style="font-size:13px;font-weight:800">طريقة الدفع</div>
 <div class="pay"><label><input type="radio" name="pm" value="كاش عند الاستلام" checked>💵 كاش عند الاستلام</label><label><input type="radio" name="pm" value="شام كاش">📱 شام كاش</label></div>
 </form></div><div id="sumb"></div><div style="height:90px"></div>
 <div class="sticky"><div class="tp"><small>الإجمالي</small><b id="ctot">${fmt(t.tot)}</b></div><button class="btn g" onclick="$('cf').requestSubmit()">تأكيد الطلب ✓</button></div>`;sumBox()}
function sumBox(){const t=totals(info.g);$('sumb').innerHTML=`<div class="box"><h3>ملخص الطلب</h3>${Object.keys(cart).map(id=>`<div class="ln">${esc(byId[id].n)} × ${cart[id]}<b>${fmt(byId[id].p*cart[id])}</b></div>`).join('')}${t.dsc?`<div class="ln">الخصم (${coupon})<b style="color:var(--ok)">-${fmt(t.dsc)}</b></div>`:''}<div class="ln">التوصيل${info.g?' إلى '+info.g:''}<b>${t.ship?fmt(t.ship):'مجاني'}</b></div><div class="ln tot">الإجمالي<span>${fmt(t.tot)}</span></div></div>`;if($('ctot'))$('ctot').textContent=fmt(t.tot)}
function placeOrder(e){e.preventDefault();const f=e.target,d=Object.fromEntries(new FormData(f));let bad=null;
 f.querySelectorAll('.bad').forEach(x=>x.classList.remove('bad'));
 const need=['n','ph','g','ar'];need.forEach(k=>{if(!d[k]||!d[k].trim()){f.elements[k].classList.add('bad');bad=bad||f.elements[k]}});
 const ph=(d.ph||'').replace(/\D/g,'');if(d.ph&&!/^(09\d{8}|9639\d{8})$/.test(ph)){f.elements.ph.classList.add('bad');bad=bad||f.elements.ph;toast('رقم الموبايل لازم يبلش بـ 09 ويكون 10 أرقام')}
 if(bad){bad.focus();if(!d.ph||/^(09\d{8}|9639\d{8})$/.test(ph))toast('كمّل المعلومات المطلوبة');return}
 info={n:d.n,ph:d.ph,g:d.g,ar:d.ar,a:d.a};S.set('info',info);
 const t=totals(d.g);const no='NNG-'+Date.now().toString().slice(-6);
 const items=Object.keys(cart).map(id=>({id:+id,q:cart[id]}));
 const o={no,date:new Date().toLocaleDateString('ar-SY'),items,tot:t.tot,pm:d.pm,g:d.g};orders=[o,...orders];S.set('orders',orders);
 const msg=`طلب جديد من متجر عالم الأواني 🛍️\nرقم الطلب: ${no}\n\n${items.map(x=>`• ${byId[x.id].n} × ${x.q} = ${fmt(byId[x.id].p*x.q)}`).join('\n')}\n\nالمجموع: ${fmt(t.sub)}${t.dsc?`\nالخصم (${coupon}): -${fmt(t.dsc)}`:''}\nالتوصيل: ${t.ship?fmt(t.ship):'مجاني'}\nالإجمالي: ${fmt(t.tot)}\nالدفع: ${d.pm}\n\nالاسم: ${d.n}\nالموبايل: ${d.ph}\nالعنوان: ${d.g} - ${d.ar} - ${d.a||''}${d.no?`\nملاحظات: ${d.no}`:''}`;
 S.set('lastmsg',msg);cart={};coupon='';S.set('coupon','');save();location.hash='#done';
 if(STORE_WA){const a=document.createElement('a');a.href='https://wa.me/'+STORE_WA+'?text='+encodeURIComponent(msg);a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();a.remove()}}
function done(){const o=orders[0];if(!o){location.hash='#home';return}
 $('v').innerHTML=`<div class="succ"><div class="ck">✓</div><h2>وصل طلبك! شكراً إلك 🌸</h2><div class="on">${o.no}</div><p style="color:var(--mu);line-height:1.8">رح نتواصل معك عالرقم يلي كتبته لنأكد الطلب ونحدد موعد التوصيل.</p>
 ${STORE_WA?`<a class="btn g" style="margin-top:16px" target="_blank" rel="noopener" href="https://wa.me/${STORE_WA}?text=${encodeURIComponent(S.get('lastmsg',''))}">إرسال الطلب عالواتساب</a>`:''}
 <a class="btn o" style="margin-top:10px" href="#orders">طلباتي</a><a class="btn" style="margin-top:10px" href="#home">متابعة التسوق</a></div>`}

/* ===== حسابي ===== */
function me(){const dark=document.documentElement.classList.contains('dark');
 $('v').innerHTML=topBar('حسابي',false)+`<div class="prof"><div class="av">${info.n?esc(info.n.trim()[0]):'👋'}</div><div><b style="font-size:17px">${info.n?'أهلاً '+esc(info.n.split(' ')[0]):'أهلاً فيك'}</b><div style="font-size:12.5px;opacity:.9">${info.ph?esc(info.ph):'معلوماتك بتنحفظ أول ما تطلب'}</div></div></div>
 <div class="menu"><a href="#orders"><i>📦</i>طلباتي<span class="ar">${orders.length||''} ‹</span></a><a href="#fav"><i>🤍</i>المفضلة<span class="ar">${favs.size||''} ‹</span></a><button onclick="toggleDark()"><i>🌙</i>الوضع الليلي<span class="ar">${dark?'شغّال':'مطفي'}</span></button></div>
 <div style="height:12px"></div>
 <div class="menu"><a href="#about"><i>🏠</i>من نحن<span class="ar">‹</span></a><a href="#faq"><i>❓</i>الأسئلة الشائعة<span class="ar">‹</span></a><a href="#policy"><i>🔄</i>سياسة الاستبدال والتوصيل<span class="ar">‹</span></a><a href="https://www.instagram.com/nng.group.syria/" target="_blank" rel="noopener"><i>📷</i>انستغرام<span class="ar">‹</span></a></div>
 <p class="note">عالم الأواني — N.N.G Group</p>`}
function toggleDark(){const on=document.documentElement.classList.toggle('dark');S.set('dark',on);me()}
function ordersView(){$('v').innerHTML=topBar('طلباتي')+(orders.length?orders.map(o=>`<div class="ord"><div class="h"><span style="direction:ltr">${o.no}</span><span class="s">قيد المراجعة</span></div><div style="font-size:12.5px;color:var(--mu);margin-top:4px">${o.date} • ${o.items.reduce((a,b)=>a+b.q,0)} قطعة • ${esc(o.pm)}</div><div class="th">${o.items.slice(0,6).map(x=>byId[x.id]?`<img src="${byId[x.id].img}" alt="">`:'').join('')}</div><div class="ln tot" style="font-size:15px">الإجمالي<span>${fmt(o.tot)}</span></div><button class="btn o" style="height:42px;font-size:14px" onclick="reorder('${o.no}')">اطلبها مرة تانية</button></div>`).join(''):`<div class="empty"><div class="ei">📦</div><b>ما عندك طلبات لسا</b><br><a class="btn" href="#home" style="max-width:220px;margin:auto">ابدأ التسوق</a></div>`)}
function reorder(no){const o=orders.find(x=>x.no===no);o.items.forEach(x=>{if(byId[x.id])cart[x.id]=(cart[x.id]||0)+x.q});save();location.hash='#cart'}
function page(t,body){$('v').innerHTML=topBar(t)+`<div class="page">${body}</div>`}
const ABOUT=`<p><b>عالم الأواني</b> من مجموعة <b>N.N.G Group</b> — أفخم ماركات أدوات المطبخ والمنزل في سورية 🏠</p><p>بدك تجهز قبل العرس؟ تفضل لعنا ❤️ عنا كل شي لبيتك: أطقم سفرة وضيافة، كاسات وفناجين، أدوات مطبخ، ساعات وديكور.</p><h3>ليش تشتري منا؟</h3><p>✅ منتجات أصلية ومختارة بعناية<br>🚚 توصيل لكل المحافظات<br>💬 خدمة عملاء سريعة</p>`;
const FAQ=[['كيف بطلب؟','ضيف المنتجات للسلة، وبعدين كبّس "متابعة للطلب" وعبّي معلوماتك. منتواصل معك لنأكد.'],['قديش بياخد التوصيل؟','داخل دمشق عادة خلال يوم أو يومين، وباقي المحافظات من 2 لـ 4 أيام.'],['كيف بدفع؟','كاش عند الاستلام أو تحويل شام كاش.'],['فيني بدّل المنتج؟','إيه، خلال 3 أيام من الاستلام إذا فيه عيب مصنعي ومع التغليف الأصلي.'],['في توصيل مجاني؟','إيه، لكل طلب فوق '+fmt(FREE_SHIP)+'.']];
const POLICY=`<h3>التوصيل</h3><p>دمشق: ${fmt(SHIP["دمشق"])} • ريف دمشق: ${fmt(SHIP["ريف دمشق"])} • باقي المحافظات: ${fmt(SHIP_OTHER)}<br>التوصيل مجاني لكل طلب فوق ${fmt(FREE_SHIP)}.</p><h3>الاستبدال</h3><p>بتقدر تبدّل المنتج خلال 3 أيام من الاستلام إذا فيه عيب مصنعي، بشرط يكون بتغليفه الأصلي.</p><h3>الدفع</h3><p>كاش عند الاستلام أو شام كاش.</p><p style="color:var(--mu);font-size:12.5px">الأسعار والرسوم حالياً تجريبية.</p>`;

/* ===== البحث ===== */
function searchView(){$('v').innerHTML=`<div class="top"><button class="ib" onclick="goBack()">${I.back}</button><input class="sin" id="sq" type="search" placeholder="دوّر على منتج..." autocomplete="off"></div><div id="sr"></div>`;
 const q=$('sq');const draw=()=>{const v=q.value.trim();if(!v){$('sr').innerHTML=(hist.length?`<div class="sec"><h2 style="font-size:15px">عمليات بحث سابقة</h2><a href="#" onclick="hist=[];S.set('hist',[]);searchView();return false">مسح</a></div><div class="hist">${hist.map(h=>`<button class="chip" onclick="sQ('${esc(h)}')">${esc(h)}</button>`).join('')}</div>`:'')+`<div class="sec"><h2 style="font-size:15px">الأكثر بحثاً</h2></div><div class="hist">${['فناجين','طقم شاي','ساعة حائط','مرطبان','كاسات','مزهرية','لوح تقطيع','كتل'].map(h=>`<button class="chip" onclick="sQ('${h}')">${h}</button>`).join('')}</div>`;return}
  const w=v.split(/\s+/);const r=P.filter(p=>w.every(x=>(p.n+' '+catT[p.c]+' '+p.d).includes(x)));
  $('sr').innerHTML=`<div class="cnt" style="padding-top:12px">${r.length} نتيجة لـ "${esc(v)}"</div>`+(r.length?`<div class="g2">${r.slice(0,40).map(card).join('')}</div>`:`<div class="empty"><div class="ei">🔎</div><b>ما لقينا شي</b>جرّب كلمة تانية</div>`)};
 let tm;q.oninput=()=>{clearTimeout(tm);tm=setTimeout(draw,150)};q.onkeydown=e=>{if(e.key==='Enter'&&q.value.trim()){hist=[q.value.trim(),...hist.filter(h=>h!==q.value.trim())].slice(0,8);S.set('hist',hist);q.blur()}};
 window.sQ=v=>{q.value=v;draw()};draw();setTimeout(()=>q.focus(),250)}

/* ===== التوجيه ===== */
function route(){const h=location.hash||'#home';closeSheet();
 if(h==='#home')home();else if(h==='#cats')cats();else if(h.startsWith('#c-')){const k=h.slice(3);listView(catT[k]||'منتجات',P.filter(p=>p.c===k),h)}
 else if(h.startsWith('#p-'))product(+h.slice(3));else if(h==='#fav')favView();else if(h==='#cart')cartView();else if(h==='#checkout')checkout();else if(h==='#done')done();
 else if(h==='#me')me();else if(h==='#orders')ordersView();else if(h==='#search')searchView();
 else if(h==='#deals')listView('العروض',P.filter(p=>p.o),h);else if(h==='#best')listView('الأكثر مبيعاً',P.filter(p=>p.b==='الأكثر مبيعاً'),h);else if(h==='#new')listView('وصل حديثاً',NEW(),h);
 else if(h==='#about')page('من نحن',ABOUT);else if(h==='#faq')page('الأسئلة الشائعة',FAQ.map(f=>`<details><summary>${f[0]}</summary><p style="margin-top:8px;color:var(--mu)">${f[1]}</p></details>`).join(''));else if(h==='#policy')page('سياسة الاستبدال والتوصيل',POLICY);
 else home();
 navDraw();if(!h.startsWith('#c-')||!route.keep)scrollTo(0,0);route.keep=false}
addEventListener('hashchange',route);
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeSheet();$('zoom').classList.remove('on')}});
route();(()=>{const t0=performance.now(),hide=()=>setTimeout(()=>$('splash').classList.add('off'),Math.max(0,450-(performance.now()-t0)));const fi=document.querySelector('.sl .bg');if(fi&&!fi.complete){fi.addEventListener('load',hide,{once:true});fi.addEventListener('error',hide,{once:true});setTimeout(hide,1200)}else hide()})();
</script>
</body>
</html>
